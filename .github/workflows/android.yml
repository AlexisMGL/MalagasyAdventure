name: Android package

# Website pushes already update the content in the installed Android app.
# Rebuild the wrapper only when its own files change, or on manual request.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android 16 wrapper and lint
        working-directory: android
        run: |
          set -o pipefail
          if bash gradlew --no-daemon lintRelease assembleDebug bundleRelease 2>&1 | tee build.log; then
            exit 0
          else
            tail -n 65 build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
      - name: Explain package status
        run: |
          echo '## Malagasy Adventure — Android' >> "$GITHUB_STEP_SUMMARY"
          echo 'The debug APK is for testing. The release AAB is unsigned and cannot be uploaded to Google Play yet.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Before publication: configure the upload key, enable Play App Signing and publish the Play signing-certificate fingerprint in assetlinks.json. See docs/ANDROID.md.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The wrapper opens the live Netlify site. Website releases do not need another Android build.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: malagasy-android-review
          retention-days: 30
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-release.html
            android/build.log
